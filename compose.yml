services:
  database:
    image: ghcr.io/tofa-rimensons/gymnastics-database:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymnastics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymnastics_password}
      POSTGRES_DB: ${POSTGRES_DB:-gymnastics_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymnastics -d gymnastics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/tofa-rimensons/gymnastics-backend:latest
    expose:
      - 8000
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://gymnastics:gymnastics_password@database:5432/gymnastics_db}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8000' || exit 1"]
      interval: 10s
      timeout: 10s

  frontend:
    image: ghcr.io/tofa-rimensons/gymnastics-frontend:latest
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000/api}
      - DATABASE_URL=${DATABASE_URL:-postgresql://gymnastics:gymnastics_password@database:5432/gymnastics_db}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:8080}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-development-secret-key-123-change-me-in-production}
    depends_on:
      database:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "--interval=30s --timeout=3s --start-period=5s --retries=3 CMD wget --quiet --tries=1 --spider http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 10s
